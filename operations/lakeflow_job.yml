# Lakeflow Job definition (Databricks Asset Bundle style). You can also build the same job in the UI:
# Jobs & Pipelines > Create > Job > add the 4 tasks below, set dependencies, retries, notifications.
# Replace YOUR_EMAIL and the notebook paths (workspace paths of the notebooks in your Git folder).
resources:
  jobs:
    ecom_medallion:
      name: ecom_medallion_bronze_silver_gold
      # NO schedule block on purpose: the assignment job is run once manually.
      email_notifications:
        on_failure: ["YOUR_EMAIL"]
        on_success: ["YOUR_EMAIL"]
      tasks:
        - task_key: bronze_ingestion
          notebook_task:
            notebook_path: /Workspace/Users/YOUR_EMAIL/ecom/notebooks/02_bronze_ingestion
          max_retries: 2
          min_retry_interval_millis: 60000
        - task_key: silver_quality
          depends_on: [{ task_key: bronze_ingestion }]
          notebook_task:
            notebook_path: /Workspace/Users/YOUR_EMAIL/ecom/notebooks/03_silver_quality
          max_retries: 2
          min_retry_interval_millis: 60000
        - task_key: gold_models
          depends_on: [{ task_key: silver_quality }]
          notebook_task:
            notebook_path: /Workspace/Users/YOUR_EMAIL/ecom/notebooks/04_gold_models
          max_retries: 2
          min_retry_interval_millis: 60000
        - task_key: quality_checks
          depends_on: [{ task_key: gold_models }]
          notebook_task:
            notebook_path: /Workspace/Users/YOUR_EMAIL/ecom/notebooks/05_quality_checks
          max_retries: 0   # a failed assertion is a real finding, retrying will not fix it
      # Serverless jobs compute: leave out new_cluster/job_clusters when serverless is available.
      # (YOUR_CATALOG must already be replaced inside the notebooks.)
